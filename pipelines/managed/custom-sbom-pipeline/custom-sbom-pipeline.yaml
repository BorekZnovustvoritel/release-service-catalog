---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: custom-sbom-pipeline
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton pipeline to generate and push component SBOMs for Snapshots.
    This is a minimal pipeline derived from push-to-external-registry, containing only the
    tasks necessary for collecting parameters and producing component SBOMs via the Mobster
    augment-component-sboms task. It supports custom CA configuration at the pipeline level.
  params:
    - name: release
      type: string
      description:
        The namespaced name (namespace/name) of the Release custom resource initiating this pipeline execution
    - name: releasePlan
      type: string
      description: The namespaced name (namespace/name) of the releasePlan
    - name: releasePlanAdmission
      type: string
      description: The namespaced name (namespace/name) of the releasePlanAdmission
    - name: releaseServiceConfig
      type: string
      description: The namespaced name (namespace/name) of the releaseServiceConfig
    - name: snapshot
      type: string
      description: The namespaced name (namespace/name) of the snapshot
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    - name: ociStorage
      type: string
      description: The OCI repository where the Trusted Artifacts are stored
      default: "quay.io/konflux-ci/release-service-trusted-artifacts"
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: "/var/workdir/release"
    - name: mobster_tasks_git_revision
      type: string
      description: The git revision to be used when consuming Mobster tasks for SBOM processing
      default: updated-custom-ca
    - name: conformaPubKey
      type: string
      description: Path to the key used by Conforma to verify attestations signed by it
      default: "k8s://openshift-pipelines/public-key"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
    - name: caCertPath
      type: string
      description: Path to CA certificate bundle for TLS verification with self-signed certificates
      default: /mnt/trusted-ca/ca-bundle.crt
  tasks:
    - name: verify-access-to-resources
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/verify-access-to-resources/verify-access-to-resources.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: requireInternalServices
          value: "false"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
    - name: collect-data
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-data/collect-data.yaml
      params:
        - name: release
          value: $(params.release)
        - name: releasePlan
          value: $(params.releasePlan)
        - name: releasePlanAdmission
          value: $(params.releasePlanAdmission)
        - name: releaseServiceConfig
          value: $(params.releaseServiceConfig)
        - name: snapshot
          value: $(params.snapshot)
        - name: subdirectory
          value: $(context.pipelineRun.uid)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: caCertPath
          value: $(params.caCertPath)
      runAfter:
        - verify-access-to-resources
    - name: collect-task-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-task-params/collect-task-params.yaml
      params:
        - name: dataDir
          value: "$(params.dataDir)"
        - name: dataPath
          value: "$(tasks.collect-data.results.data)"
        - name: keysToExtract
          value: |
            [
              {"resultIndex": 0, "key": ".sign.cosignSecretName", "default": "secret-not-present"}
            ]
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: caCertPath
          value: $(params.caCertPath)
      runAfter:
        - collect-data
    - name: collect-signing-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-signing-params/collect-signing-params.yaml
      params:
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
      runAfter:
        - collect-data
    - name: collect-tpa-params
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/collect-tpa-params/collect-tpa-params.yaml
      params:
        - name: dataPath
          value: "$(tasks.collect-data.results.data)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: caCertPath
          value: $(params.caCertPath)
      runAfter:
        - collect-data
    - name: reduce-snapshot
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/reduce-snapshot/reduce-snapshot.yaml
      params:
        - name: SNAPSHOT
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: SINGLE_COMPONENT
          value: $(tasks.collect-data.results.singleComponentMode)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE
          value: snapshot/$(tasks.collect-data.results.snapshotName)
        - name: SINGLE_COMPONENT_CUSTOM_RESOURCE_NS
          value: $(tasks.collect-data.results.snapshotNamespace)
        - name: SNAPSHOT_PATH
          value: $(params.dataDir)/$(tasks.collect-data.results.snapshotSpec)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.collect-data.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: caCertPath
          value: $(params.caCertPath)
      runAfter:
        - collect-data
    - name: apply-mapping
      retries: 3
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/apply-mapping/apply-mapping.yaml
      params:
        - name: failOnEmptyResult
          value: "true"
        - name: dataPath
          value: "$(tasks.collect-data.results.data)"
        - name: snapshotPath
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.reduce-snapshot.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: caCertPath
          value: $(params.caCertPath)
      runAfter:
        - reduce-snapshot
    - name: filter-already-released-images
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/filter-already-released-images/filter-already-released-images.yaml
      params:
        - name: snapshotPath
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.apply-mapping.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: caCertPath
          value: $(params.caCertPath)
      runAfter:
        - apply-mapping
    - name: process-component-sbom
      when:
        - input: "$(tasks.collect-tpa-params.results.atlasApiUrl)"
          operator: notin
          values: [""]
      taskRef:
        params:
          - name: url
            value: https://github.com/BorekZnovustvoritel/mobster.git
          - name: revision
            value: $(params.mobster_tasks_git_revision)
          - name: pathInRepo
            value: tasks/augment-component-sboms-ta/0.3/augment-component-sboms-ta.yaml
        resolver: git
      params:
        - name: resultsDirPath
          value: $(tasks.collect-data.results.resultsDir)
        - name: snapshotSpec
          value: "$(tasks.collect-data.results.snapshotSpec)"
        - name: releaseData
          value: "$(tasks.collect-data.results.data)"
        - name: retryAWSSecretName
          value: "$(tasks.collect-tpa-params.results.retryAWSSecretName)"
        - name: retryS3Bucket
          value: "$(tasks.collect-tpa-params.results.retryS3Bucket)"
        - name: atlasSecretName
          value: "$(tasks.collect-tpa-params.results.secretName)"
        - name: ssoTokenUrl
          value: "$(tasks.collect-tpa-params.results.ssoTokenUrl)"
        - name: atlasApiUrl
          value: "$(tasks.collect-tpa-params.results.atlasApiUrl)"
        - name: ociStorage
          value: $(params.ociStorage)
        - name: sourceDataArtifact
          value: "$(tasks.filter-already-released-images.results.sourceDataArtifact)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: cosignSecretName
          value: "$(tasks.collect-task-params.results.extractedValues[0])"
        - name: attestationPubKey
          value: "$(params.conformaPubKey)"
        - name: defaultOIDCIssuer
          value: "$(tasks.collect-signing-params.results.defaultOIDCIssuer)"
        - name: rekorExternalUrl
          value: "$(tasks.collect-signing-params.results.rekorExternalUrl)"
        - name: fulcioExternalUrl
          value: "$(tasks.collect-signing-params.results.fulcioExternalUrl)"
        - name: tufExternalUrl
          value: "$(tasks.collect-signing-params.results.tufExternalUrl)"
        - name: buildIdentityRegexp
          value: "$(tasks.collect-signing-params.results.buildIdentityRegexp)"
      runAfter:
        - collect-data
        - apply-mapping
        - collect-tpa-params
    - name: update-cr-status
      params:
        - name: resource
          value: $(params.release)
        - name: resultsDirPath
          value: $(tasks.collect-data.results.resultsDir)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: resultArtifacts
          value:
            - "$(tasks.filter-already-released-images.results.sourceDataArtifact)=$(params.dataDir)"
        - name: dataDir
          value: $(params.dataDir)
        - name: trustedArtifactsDebug
          value: "$(params.trustedArtifactsDebug)"
        - name: taskGitUrl
          value: "$(params.taskGitUrl)"
        - name: taskGitRevision
          value: "$(params.taskGitRevision)"
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: caCertPath
          value: $(params.caCertPath)
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/managed/update-cr-status/update-cr-status.yaml
      runAfter:
        - process-component-sbom
